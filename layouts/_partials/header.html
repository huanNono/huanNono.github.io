<header class="header site-header">
  <nav class="header-nav site-nav" aria-label="主导航">
    <a class="wordmark" href="{{ "" | relLangURL }}" aria-label="{{ site.Title }} 首页">{{ site.Title }}</a>
    <ul id="menu" class="menu">
      {{ range site.Menus.main }}
      {{ $active := hasPrefix $.RelPermalink .URL }}
      <li><a href="{{ .URL | relLangURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
    <div class="nav-tools">
      <a class="icon-control" href="{{ "search/" | relURL }}" aria-label="搜索文章" title="搜索文章" accesskey="/">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </a>
      {{ if not site.Params.disableThemeToggle }}
      <button id="theme-toggle" class="theme-toggle icon-control" accesskey="t" title="切换明暗主题" aria-label="切换明暗主题">
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
      </button>
      {{ end }}
    </div>
  </nav>
</header>
