<article class="note-row">
  <a class="note-link" href="{{ .RelPermalink }}">
    <time lang="en" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    <h3>{{ .Title }}{{ if .Draft }} <small lang="en">Draft</small>{{ end }}</h3>
    <span class="note-arrow" aria-hidden="true">{{ partial "reader-icon.html" "next" }}{{ partial "arrow.html" . }}</span>
  </a>
</article>
