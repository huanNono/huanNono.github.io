<ul class="social-accounts" aria-label="Social accounts">
  {{ range hugo.Data.social }}
  <li>
    {{ if .url }}
    <a class="social-account" href="{{ .url }}" target="_blank" rel="noopener noreferrer" title="{{ .name }}" aria-label="{{ .name }} (opens in a new tab)">
      <span class="social-symbol" aria-hidden="true">{{ partial "social-icon.html" (dict "name" .icon) }}</span>
    </a>
    {{ else }}
    <span class="social-account social-pending" role="img" title="{{ .name }} (coming soon)" aria-label="{{ .name }} (coming soon)">
      <span class="social-symbol" aria-hidden="true">{{ partial "social-icon.html" (dict "name" .icon) }}</span>
    </span>
    {{ end }}
  </li>
  {{ end }}
</ul>
