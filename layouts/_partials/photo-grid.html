<div class="photo-grid">
  {{ range .photos }}
  <figure class="photo-item">
    <a class="photo-image" href="{{ .src | relURL }}" aria-label="查看照片：{{ .title }}">
      <img src="{{ .src | relURL }}" alt="{{ .alt | default .title }}" loading="lazy" decoding="async" width="900" height="600"{{ with .position }} style="object-position: {{ . }}"{{ end }}>
    </a>
    <figcaption><span>{{ .title }}</span>{{ with .detail }}<span>{{ . }}</span>{{ end }}</figcaption>
  </figure>
  {{ else }}
  {{ range seq 4 }}
  <figure class="photo-item photo-pending">
    <div class="photo-image">
      <span class="frame-number" aria-hidden="true">{{ printf "%02d" . }}</span>
      <div class="photo-empty-message"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M8 5 9.5 3h5L16 5h4a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/><circle cx="12" cy="12.5" r="4"/></svg><span>照片待收录</span></div>
    </div>
  </figure>
  {{ end }}
  {{ end }}
</div>
