baseURL: "https://huannono.github.io/"
title: "YOYO"
locale: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true
timeZone: Asia/Shanghai
theme: PaperMod
enableRobotsTXT: true
cleanDestinationDir: true
buildDrafts: false
buildFuture: false
buildExpired: false
pagination:
  pagerSize: 8
outputs:
  home: [HTML, RSS, JSON]
permalinks:
  posts: /posts/:slug/
taxonomies:
  category: categories
  tag: tags
params:
  description: "记录学习中的理解，也收集生活里的片段。"
  author: YOYO
  mainSections: [posts]
  DateFormat: "2006年1月2日"
  defaultTheme: light
  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowRssButtonInSectionTermList: true
  comments: false
  showtoc: true
  tocopen: false
  disableSpecial1stPost: true
  assets:
    favicon: /favicon.svg
    favicon16x16: /favicon.svg
    favicon32x32: /favicon.svg
    apple_touch_icon: /favicon.svg
    safari_pinned_tab: /favicon.svg
    disableHLJS: true
  fuseOpts:
    ignoreLocation: true
    threshold: 0.35
    minMatchCharLength: 1
    keys: [title, summary, content]
menu:
  main:
    - name: Blog
      url: /posts/
      weight: 10
    - name: Project
      url: /projects/
      weight: 20
    - name: Share
      url: /share/
      weight: 30
    - name: Links
      url: /links/
      weight: 40
    - name: About
      url: /about/
      weight: 50
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: false
caches:
  images:
    dir: :cacheDir/images
